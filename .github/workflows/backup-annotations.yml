name: Backup annotations

# The weekly Hypothes.is backup to the `backups` branch. The job is the platform's,
# quartz-book's book-backup-annotations.yml (BOOK-ONE-TO-QUARTZ §8 step 14).
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    uses: textbookproject2026-alt/quartz-book/.github/workflows/book-backup-annotations.yml@stable
    secrets:
      HYPOTHESIS_API_TOKEN: ${{ secrets.HYPOTHESIS_API_TOKEN }}
