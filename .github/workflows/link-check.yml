name: Check links

# lychee over the Markdown, on changes and weekly (links rot without any change
# here). The job is quartz-book's book-link-check.yml (BOOK-ONE-TO-QUARTZ §8 step 14).
on:
  push:
    paths: ["**/*.md", ".lycheeignore", ".github/workflows/link-check.yml"]
  pull_request:
    paths: ["**/*.md", ".lycheeignore", ".github/workflows/link-check.yml"]
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  lychee:
    uses: textbookproject2026-alt/quartz-book/.github/workflows/book-link-check.yml@stable
