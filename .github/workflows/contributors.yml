name: Update contributors

# Weekly rebuild of community/contributors.md from the repository's commit
# history (scripts/gen-contributors.mjs), proposed as a pull request.
#
# WHY A PULL REQUEST AND NOT A PUSH
# ---------------------------------
# main is branch-protected and requires a pull request; github-actions[bot]
# cannot bypass that rule, so `git push origin main` from here would simply be
# rejected. backup-annotations.yml solves the same problem by pushing to an
# unprotected `backups` branch, but that answer does not work for this job —
# the contributors page has to be ON main to appear in the book. So the job
# pushes a machine-owned branch (chore/contributors-update) and opens a pull
# request against main for a human to merge.
#
# The branch is disposable: every run rebuilds it from main and force-pushes.
# If a pull request is already open for it, the force-push updates that pull
# request in place rather than opening a second one. If the regenerated page is
# byte-identical to what is already on main, the job stops before touching git
# at all — a quiet week produces no branch, no pull request, and no noise.

on:
  schedule:
    - cron: "0 7 * * 0" # 07:00 UTC every Sunday — four hours clear of the 03:00 annotation backup
  workflow_dispatch:

permissions:
  contents: write # push the chore/contributors-update branch
  pull-requests: write # open or update the pull request

# A manual run and the scheduled run must never race for the same branch.
concurrency:
  group: contributors
  cancel-in-progress: false

env:
  PR_BRANCH: chore/contributors-update
  PAGE: community/contributors.md

jobs:
  contributors:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 is load-bearing. The script counts real authorship from
      # `git log`; on a shallow clone it would see one commit and report one
      # contributor with one change.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Regenerate the contributors page
        run: node scripts/gen-contributors.mjs

      - name: Has the page actually changed?
        id: page
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- "$PAGE")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The contributors page is already current — nothing to propose."
            echo "Contributors page already current; no pull request opened." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- "$PAGE"
          fi

      - name: Open or update the pull request
        if: steps.page.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          OPEN_PR="$(gh pr list --head "$PR_BRANCH" --state open --json number --jq '.[0].number // empty')"

          # The page differs from main, but it may already match the branch — a
          # pull request opened last Sunday and not merged yet. Re-pushing an
          # identical page would only re-notify its reviewers every week.
          if [ -n "$OPEN_PR" ] && git fetch --quiet origin "$PR_BRANCH" 2>/dev/null; then
            if git show "FETCH_HEAD:$PAGE" 2>/dev/null | diff -q - "$PAGE" >/dev/null 2>&1; then
              echo "PR #${OPEN_PR} already proposes this exact page — leaving it alone."
              echo "Contributors PR #${OPEN_PR} already up to date." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          # Rebuilt from main every run, so --force is the intent and not a
          # rescue: nothing but this job ever commits to this branch.
          git checkout -q -B "$PR_BRANCH"
          git add -- "$PAGE"
          git commit -q -m "chore(community): refresh contributors page"
          git push --quiet --force origin "HEAD:refs/heads/$PR_BRANCH"

          if [ -n "$OPEN_PR" ]; then
            echo "Updated existing PR #${OPEN_PR}."
            echo "Updated contributors PR #${OPEN_PR}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cat > "${RUNNER_TEMP}/pr-body.md" <<'BODY'
          Rebuilds `community/contributors.md` from the commit history, as
          `.github/workflows/contributors.yml` does every Sunday.

          The page is generated by `scripts/gen-contributors.mjs`: commit counts,
          first and most recent contribution, and each contributor's most-worked-on
          pages under `chapters/`. Bot identities are excluded from the table.

          Nothing here is urgent — merge it whenever, or close it and the next run
          will propose the page again.
          BODY

          URL="$(gh pr create \
            --base main \
            --head "$PR_BRANCH" \
            --title "chore(community): refresh contributors page" \
            --body-file "${RUNNER_TEMP}/pr-body.md")"

          echo "Opened ${URL}"
          echo "Opened contributors PR: ${URL}" >> "$GITHUB_STEP_SUMMARY"
