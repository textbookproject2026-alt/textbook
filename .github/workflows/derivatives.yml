name: Update derivatives map

# Weekly rebuild of community/derivatives.md — the list of department editions
# — from the forks of the edition template (scripts/gen-derivatives.mjs),
# proposed as a pull request.
#
# WHY A PULL REQUEST AND NOT A PUSH
# ---------------------------------
# main is branch-protected and requires a pull request; github-actions[bot]
# cannot bypass that rule, so `git push origin main` from here would simply be
# rejected. The derivatives page has to be ON main to appear in the book, so
# the job pushes a machine-owned branch (chore/derivatives-update) and opens a
# pull request against main for a human to merge — exactly as
# contributors.yml does.
#
# The branch is disposable: every run rebuilds it from main and force-pushes.
# If a pull request is already open for it, the force-push updates that pull
# request in place rather than opening a second one. If the regenerated page is
# byte-identical to what is already on main, the job stops before touching git
# at all — a quiet week produces no branch, no pull request, and no noise.
#
# WHAT IT READS
# -------------
# The forks of textbookproject2026-alt/textbook-edition-template, over the
# public API. Nothing about this repository's own forks is relevant: a fork of
# the textbook is a copy of the manuscript, not a department edition. The
# built-in GITHUB_TOKEN is passed to the script only to lift the 60-per-hour
# unauthenticated rate limit — the data read is public either way.
#
# AUTO-MERGE
# ----------
# The pull request this job opens merges itself: the final step arms GitHub's
# auto-merge, so the squash lands as soon as main's protection is satisfied.
# Nobody has to shepherd a weekly chore pull request, and unmerged ones stop
# piling up on the repository.
#
# That is safe for THIS pull request, and would not be for a content one,
# because of what the final step checks before it arms anything. It re-reads
# the pull request from the API and requires all three of: the author is
# github-actions[bot], exactly one file changed, and that file is
# community/derivatives.md — the page this workflow generates. Anything failing
# any of the three is left open for a human. The branch name is deliberately
# not part of the test: anyone with write access can push a branch called
# chore/derivatives-update, so trusting the name would trust the pusher.
#
# The page is machine-owned as well as machine-authored. scripts/gen-derivatives.mjs
# rebuilds it from scratch on every run, so there is no human edit on it to
# lose and no judgement in it to review — merging it unread costs nothing, and
# a wrong page is corrected by the next run rather than by a revert.
#
# None of that holds for a chapter. A content pull request carries prose
# somebody wrote and somebody else has to read, and the guard above refuses it
# by construction. Required review on main is what protects those, and it must
# stay in place.
#
# Arming auto-merge needs "Allow auto-merge" switched on in the repository
# settings, and needs main's protection to let github-actions[bot] satisfy it.
# Until both are true the step logs a warning and leaves the pull request open;
# it never fails the run.

on:
  schedule:
    - cron: "0 11 * * 0" # 11:00 UTC every Sunday — clear of the 03:00 backup and the 07:00 contributors run
  workflow_dispatch:

permissions:
  contents: write # push the chore/derivatives-update branch
  pull-requests: write # open or update the pull request

# A manual run and the scheduled run must never race for the same branch.
concurrency:
  group: derivatives
  cancel-in-progress: false

env:
  PR_BRANCH: chore/derivatives-update
  PAGE: community/derivatives.md

jobs:
  derivatives:
    runs-on: ubuntu-latest

    steps:
      # No fetch-depth: 0 here — unlike the contributors page, nothing on this
      # page comes from the commit history, so a shallow clone is enough.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Regenerate the derivatives map
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/gen-derivatives.mjs

      - name: Has the page actually changed?
        id: page
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- "$PAGE")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The derivatives map is already current — nothing to propose."
            echo "Derivatives map already current; no pull request opened." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- "$PAGE"
          fi

      - name: Open or update the pull request
        id: pr
        if: steps.page.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          OPEN_PR="$(gh pr list --head "$PR_BRANCH" --state open --json number --jq '.[0].number // empty')"

          # The page differs from main, but it may already match the branch — a
          # pull request opened last Sunday and not merged yet. Re-pushing an
          # identical page would only re-notify its reviewers every week.
          if [ -n "$OPEN_PR" ] && git fetch --quiet origin "$PR_BRANCH" 2>/dev/null; then
            if git show "FETCH_HEAD:$PAGE" 2>/dev/null | diff -q - "$PAGE" >/dev/null 2>&1; then
              echo "PR #${OPEN_PR} already proposes this exact page — leaving it alone."
              echo "Derivatives PR #${OPEN_PR} already up to date." >> "$GITHUB_STEP_SUMMARY"
              echo "number=${OPEN_PR}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Rebuilt from main every run, so --force is the intent and not a
          # rescue: nothing but this job ever commits to this branch.
          git checkout -q -B "$PR_BRANCH"
          git add -- "$PAGE"
          git commit -q -m "chore(community): refresh derivatives map"
          git push --quiet --force origin "HEAD:refs/heads/$PR_BRANCH"

          if [ -n "$OPEN_PR" ]; then
            echo "Updated existing PR #${OPEN_PR}."
            echo "Updated derivatives PR #${OPEN_PR}." >> "$GITHUB_STEP_SUMMARY"
            echo "number=${OPEN_PR}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat > "${RUNNER_TEMP}/pr-body.md" <<'BODY'
          Rebuilds `community/derivatives.md` from the forks of the edition
          template, as `.github/workflows/derivatives.yml` does every Sunday.

          The page is generated by `scripts/gen-derivatives.mjs`: one entry per
          department edition, with its owner, what it is, when it last changed,
          and links to the repository and — where the repository says so — the
          live site. Archived forks and the project's own copies are left out.

          A new entry here means someone has published an edition; a changed
          date means an existing one has moved. Nothing is urgent — merge it
          whenever, or close it and the next run will propose the page again.
          BODY

          URL="$(gh pr create \
            --base main \
            --head "$PR_BRANCH" \
            --title "chore(community): refresh derivatives map" \
            --body-file "${RUNNER_TEMP}/pr-body.md")"

          echo "Opened ${URL}"
          echo "Opened derivatives PR: ${URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "number=${URL##*/}" >> "$GITHUB_OUTPUT"

      # Everything this step trusts about the pull request is re-read from the
      # API. Nothing is inferred from the branch it came from — see AUTO-MERGE
      # in the header for why that distinction is the whole safety argument.
      - name: Arm auto-merge on the pull request
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          WHO="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.user.login + "/" + .user.type')"
          if [ "$WHO" != "github-actions[bot]/Bot" ]; then
            echo "::warning::PR #${PR} is authored by ${WHO}, not github-actions[bot]/Bot — leaving it for a human."
            exit 0
          fi

          # One newline-joined string, so this single comparison rejects both a
          # pull request touching some other file and one touching more files
          # than the page. --paginate so a large pull request cannot pass as a
          # one-file change on the strength of its first page of results.
          FILES="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename')"
          if [ "$FILES" != "$PAGE" ]; then
            echo "::warning::PR #${PR} changes [${FILES}], not exactly ${PAGE} — leaving it for a human."
            exit 0
          fi

          if gh pr merge "$PR" --auto --squash; then
            echo "Auto-merge armed on PR #${PR}; it squashes itself once main is satisfied."
            echo "Auto-merge armed on derivatives PR #${PR}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # GitHub refuses to arm auto-merge on a pull request that is already
          # mergeable — the one case where there is nothing left to wait for.
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.mergeable_state')" = "clean" ] \
            && gh pr merge "$PR" --squash; then
            echo "Nothing left to wait for; merged PR #${PR}."
            echo "Merged derivatives PR #${PR}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::warning::Could not arm auto-merge on PR #${PR}. Check that \"Allow auto-merge\" is on under Settings -> General, and that main's protection lets github-actions[bot] merge. The pull request is open and untouched."
