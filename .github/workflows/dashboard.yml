name: Update dashboard

# Weekly rebuild of community/dashboard.md — the project health page — from the
# Hypothes.is API and the GitHub API (scripts/gen-dashboard.mjs), proposed as a
# pull request.
#
# SECRETS THIS WORKFLOW NEEDS
# ---------------------------
#   HYPOTHESIS_API_TOKEN  (already present — backup-annotations.yml uses the
#                         same secret). Needed because the private course
#                         groups are invisible without it, and a group queried
#                         with no token returns HTTP 200 and zero rows rather
#                         than an error, so an unauthenticated run would report
#                         a quieter margin than the book actually has.
#
# Nothing else. Repository and edition figures come from the built-in
# GITHUB_TOKEN, and readership is a LINK to the site's already-public Plausible
# dashboard rather than an API call — the Plausible Stats API needs a paid plan
# and a second expiring secret to keep alive, which is a poor trade for numbers
# a reader can already see.
#
# WHY A PULL REQUEST AND NOT A PUSH
# ---------------------------------
# main is branch-protected and requires a pull request; github-actions[bot]
# cannot bypass that rule, so `git push origin main` from here would simply be
# rejected. The dashboard has to be ON main to appear in the book, so the job
# pushes a machine-owned branch (chore/dashboard-update) and opens a pull
# request against main for a human to merge — exactly as contributors.yml and
# derivatives.yml do.
#
# The branch is disposable: every run rebuilds it from main and force-pushes.
# If a pull request is already open for it, the force-push updates that pull
# request in place rather than opening a second one. If the regenerated page is
# byte-identical to what is already on main, the job stops before touching git
# at all — a quiet week produces no branch, no pull request, and no noise.
#
# A FAILED RUN PUBLISHES NOTHING
# ------------------------------
# The script throws on any API failure — a rejected token, a rate limit, a
# group the account has been removed from — before it writes a byte. That
# matters more here than on the other two pages: a half-fetched dashboard does
# not look broken, it looks like a book nobody is reading. If this job goes red
# the page simply stays as it was.

on:
  schedule:
    - cron: "0 15 * * 0" # 15:00 UTC every Sunday — clear of the 03:00 backup, the 07:00 contributors run and the 11:00 derivatives run
  workflow_dispatch:

permissions:
  contents: write # push the chore/dashboard-update branch
  pull-requests: write # open or update the pull request

# A manual run and the scheduled run must never race for the same branch.
concurrency:
  group: dashboard
  cancel-in-progress: false

env:
  PR_BRANCH: chore/dashboard-update
  PAGE: community/dashboard.md

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Check the API token secret is present
        env:
          HYPOTHESIS_API_TOKEN: ${{ secrets.HYPOTHESIS_API_TOKEN }}
        run: |
          if [ -z "$HYPOTHESIS_API_TOKEN" ]; then
            echo "::error::Repository secret HYPOTHESIS_API_TOKEN is not set. It is the same secret backup-annotations.yml uses; add it under Settings -> Secrets and variables -> Actions, from https://hypothes.is/account/developer while signed in as the account that owns the annotation groups."
            exit 1
          fi

      # No fetch-depth: 0 here — nothing on this page is read from the local
      # commit history; the repository figures come from the GitHub API.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Regenerate the dashboard
        env:
          HYPOTHESIS_API_TOKEN: ${{ secrets.HYPOTHESIS_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/gen-dashboard.mjs

      - name: Has the page actually changed?
        id: page
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- "$PAGE")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The dashboard is already current — nothing to propose."
            echo "Dashboard already current; no pull request opened." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- "$PAGE"
          fi

      - name: Open or update the pull request
        if: steps.page.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          OPEN_PR="$(gh pr list --head "$PR_BRANCH" --state open --json number --jq '.[0].number // empty')"

          # The page differs from main, but it may already match the branch — a
          # pull request opened last Sunday and not merged yet. Re-pushing an
          # identical page would only re-notify its reviewers every week.
          if [ -n "$OPEN_PR" ] && git fetch --quiet origin "$PR_BRANCH" 2>/dev/null; then
            if git show "FETCH_HEAD:$PAGE" 2>/dev/null | diff -q - "$PAGE" >/dev/null 2>&1; then
              echo "PR #${OPEN_PR} already proposes this exact page — leaving it alone."
              echo "Dashboard PR #${OPEN_PR} already up to date." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          # Rebuilt from main every run, so --force is the intent and not a
          # rescue: nothing but this job ever commits to this branch.
          git checkout -q -B "$PR_BRANCH"
          git add -- "$PAGE"
          git commit -q -m "chore(community): refresh project dashboard"
          git push --quiet --force origin "HEAD:refs/heads/$PR_BRANCH"

          if [ -n "$OPEN_PR" ]; then
            echo "Updated existing PR #${OPEN_PR}."
            echo "Updated dashboard PR #${OPEN_PR}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cat > "${RUNNER_TEMP}/pr-body.md" <<'BODY'
          Rebuilds `community/dashboard.md` from the Hypothes.is and GitHub APIs,
          as `.github/workflows/dashboard.yml` does every Sunday.

          The page is generated by `scripts/gen-dashboard.mjs`: annotation totals
          for the public layer and each course group, contributor and commit
          counts, the number of department editions, what is open against the
          repository, and the state of the `suggested-edit` queue. Readership is
          linked to the site's public Plausible dashboard rather than copied.

          No individual annotator is named or counted on this page — the
          annotation figures are aggregates only.

          Nothing here is urgent — merge it whenever, or close it and the next
          run will propose the page again.
          BODY

          URL="$(gh pr create \
            --base main \
            --head "$PR_BRANCH" \
            --title "chore(community): refresh project dashboard" \
            --body-file "${RUNNER_TEMP}/pr-body.md")"

          echo "Opened ${URL}"
          echo "Opened dashboard PR: ${URL}" >> "$GITHUB_STEP_SUMMARY"
