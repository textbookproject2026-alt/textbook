name: Update dashboard

# community/dashboard.md, proposed as a pull request that merges itself. The job is the
# platform's, quartz-book's book-community-page.yml (BOOK-ONE-TO-QUARTZ §8 step 14).
on:
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  dashboard:
    uses: textbookproject2026-alt/quartz-book/.github/workflows/book-community-page.yml@stable
    with:
      page: dashboard
    secrets:
      HYPOTHESIS_API_TOKEN: ${{ secrets.HYPOTHESIS_API_TOKEN }}
