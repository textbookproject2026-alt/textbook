name: Weekly snapshot

# A dated snapshot-YYYY-MM-DD tag of main, when it changed. The job is the
# platform's, quartz-book's book-weekly-snapshot.yml (BOOK-ONE-TO-QUARTZ §8 step 14).
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    uses: textbookproject2026-alt/quartz-book/.github/workflows/book-weekly-snapshot.yml@stable
